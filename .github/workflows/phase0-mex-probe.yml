name: Phase 0 MEX load probe (GraphVar 2.03a on MATLAB R2026b)
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        draw: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/phase0 && tools/cpu_gate.sh results/phase0/cpu.txt
      - name: Fetch and verify GraphVar 2.03a from NITRC (never committed)
        run: tools/fetch_graphvar.sh "$RUNNER_TEMP/gv"
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          sha256sum "$file" | tee -a results/phase0/cpu.txt
      - name: Probe session 1
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && hashFiles('results/phase0/probe_done') == '' }}
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('drivers'); probe_mex(fullfile(getenv('RUNNER_TEMP'),'gv','GraphVar_2.03a'), fullfile(pwd,'results','phase0','probe_log.jsonl'), 'resume', ''); fclose(fopen(fullfile(pwd,'results','phase0','probe_done'),'w'));
      - name: Probe session 2
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && hashFiles('results/phase0/probe_done') == '' }}
