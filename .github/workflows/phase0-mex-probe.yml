name: Phase 0 MEX load probe (GraphVar 2.03a on MATLAB R2026b)
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        draw: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/phase0 && tools/cpu_gate.sh results/phase0/cpu.txt
      - name: Fetch and verify GraphVar 2.03a from NITRC (never committed)
        run: tools/fetch_graphvar.sh "$RUNNER_TEMP/gv"
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          sha256sum "$file" | tee -a results/phase0/cpu.txt
      - name: Check MATLAB runs from the shell
        if: ${{ steps.setup.outcome == 'success' }}
        run: matlab -batch "disp(version)"
      - name: Probe every item in its own MATLAB process
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -uo pipefail
          tools/run_probe.sh "$RUNNER_TEMP/gv/GraphVar_2.03a" results/phase0
      - name: Assemble report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/assemble_probe.py results/phase0/probe_log.jsonl results/phase0/probe_report.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-mex-probe-${{ matrix.os }}-${{ matrix.draw }}
          path: results/phase0/
