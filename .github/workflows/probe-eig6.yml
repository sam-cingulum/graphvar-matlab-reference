name: "Eig probe 6 (eig at n = 600..1000 with stage outputs, signed zeros in dlarft T, large-k dgemm NN, few-row dtrmm)"
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, draw: 1}
          - {os: ubuntu-22.04, draw: 2}
          - {os: ubuntu-22.04, draw: 3}
          - {os: ubuntu-22.04, draw: 4}
          - {os: ubuntu-22.04, draw: 5}
          - {os: ubuntu-22.04, draw: 6}
          - {os: ubuntu-24.04, draw: 1}
          - {os: ubuntu-24.04, draw: 2}
          - {os: ubuntu-24.04, draw: 3}
          - {os: ubuntu-24.04, draw: 4}
          - {os: ubuntu-24.04, draw: 5}
          - {os: ubuntu-24.04, draw: 6}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/eig6 && tools/cpu_gate.sh results/eig6/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_eig6.py cases/eig
      - name: Record input hashes
        run: |
          set -euo pipefail
          sha256sum cases/eig/eig6.json tools/gen_eig6.py drivers/probe_eig6.m probes/eig/kpeig.c probes/eig/kpeig2.c probes/eig/kpeig3.c probes/eig/kpeig4.c | tee results/eig6/inputs_sha256.txt
          (cd cases/eig/eig6 && LC_ALL=C ls | xargs cat | sha256sum | sed 's/-$/eig6\/*.bin (concatenated, sorted by name)/') | tee -a results/eig6/inputs_sha256.txt
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          for lib in libmwmathspec.so libmwlapack.so libmwblas.so; do
            file="$(find /opt/hostedtoolcache/MATLAB -name "$lib" -print -quit)"
            if [ -n "$file" ]; then sha256sum "$(readlink -f "$file")" | tee -a results/eig6/cpu.txt; fi
          done
          gcc --version | head -1 | tee -a results/eig6/cpu.txt
      - name: Eig probe 6
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); probe_eig6('cases/eig', 'results/eig6')
      - name: Hash outputs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          rm -rf results/eig6/mex
          (cd results/eig6 && sha256sum eig6.jsonl && find blobs -type f | LC_ALL=C sort | xargs cat | sha256sum | sed 's/-$/blobs (concatenated, sorted by name)/') | tee results/eig6/outputs_sha256.txt
      - name: Upload
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eig6-probe-${{ matrix.os }}-${{ matrix.draw }}
          path: results/eig6
