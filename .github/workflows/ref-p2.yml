name: Phase 2 reference (matrix multiply, long sums, P2-01 clustering, P1-01 v2, phase-1 replay)
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, draw: 1}
          - {os: ubuntu-22.04, draw: 2}
          - {os: ubuntu-22.04, draw: 3}
          - {os: ubuntu-24.04, draw: 1}
          - {os: ubuntu-24.04, draw: 2}
          - {os: ubuntu-24.04, draw: 3}
          - {os: ubuntu-24.04, draw: 4}
          - {os: ubuntu-24.04, draw: 5}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/p2 && tools/cpu_gate.sh results/p2/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_p103.py cases/p103 && python3 -I tools/gen_p2.py cases/p2
      - name: Record input hashes
        run: sha256sum cases/phase1/*.json cases/p103/*.json cases/p2/*.json tools/gen_p103.py tools/gen_p2.py drivers/ref_p2.m drivers/ref_phase1.m | tee results/p2/inputs_sha256.txt
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          sha256sum "$file" | tee -a results/p2/cpu.txt
      - name: Matrix multiply and long-sum probes
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); fprintf('%s\n', version('-blas')); ref_p2('cases/p2', 'results/p2')
      - name: P1-01 v2 constructions and P2-01 measures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); b = fullfile(getenv('RUNNER_TEMP'),'bct','2019_03_03_BCT'); ref_phase1(b, 'cases/p2', 'results/p2/m', 'p2construct'); ref_phase1(b, 'cases/p2', 'results/p2/m', 'p2measures')
      - name: Phase-1 replay under one thread (corrected M26)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); b = fullfile(getenv('RUNNER_TEMP'),'bct','2019_03_03_BCT'); ref_phase1(b, 'cases/phase1', 'results/p2/phase1_1thread', 'prim'); ref_phase1(b, 'cases/phase1', 'results/p2/phase1_1thread', 'construct'); ref_phase1(b, 'cases/phase1', 'results/p2/phase1_1thread', 'measures')
      - name: Digest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          for p in construct measures; do
            [ -f results/p2/m/$p.jsonl ] && python3 tools/digest_blobs.py results/p2/m/$p.jsonl results/p2/m/blobs results/p2/m/$p.json
          done
          rm -rf results/p2/m/blobs
          for p in prim construct measures1; do
            [ -f results/p2/phase1_1thread/$p.jsonl ] && python3 tools/digest_blobs.py results/p2/phase1_1thread/$p.jsonl results/p2/phase1_1thread/blobs results/p2/phase1_1thread/$p.json
          done
          rm -rf results/p2/phase1_1thread/blobs
      - name: Upload
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-reference-${{ matrix.os }}-${{ matrix.draw }}
          path: |
            results/p2/*.jsonl
            results/p2/*.txt
            results/p2/m/*.json
            results/p2/phase1_1thread/*.json
