name: Phase 2b reference (Gram X.'*X, X*X.', distinct X.'*Y, inner products)
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, draw: 1}
          - {os: ubuntu-22.04, draw: 2}
          - {os: ubuntu-22.04, draw: 3}
          - {os: ubuntu-24.04, draw: 1}
          - {os: ubuntu-24.04, draw: 2}
          - {os: ubuntu-24.04, draw: 3}
          - {os: ubuntu-24.04, draw: 4}
          - {os: ubuntu-24.04, draw: 5}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/p2b && tools/cpu_gate.sh results/p2b/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_p2b.py cases/p2b
      - name: Record input hashes
        run: sha256sum cases/p2b/*.json tools/gen_p2b.py drivers/ref_p2b.m | tee results/p2b/inputs_sha256.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          sha256sum "$file" | tee -a results/p2b/cpu.txt
      - name: Gram and inner-product probes
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); fprintf('%s\n', version('-blas')); ref_p2b('cases/p2b', 'results/p2b')
      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p2b-reference-${{ matrix.os }}-${{ matrix.draw }}
          path: |
            results/p2b/*.jsonl
            results/p2b/*.txt
