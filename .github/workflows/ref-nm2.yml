name: "Null models 2 (randperm(n,k) on crafted streams, small-world propensity without graphallshortestpaths; old-release evidence)"
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  r2026b:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, draw: 1}
          - {os: ubuntu-22.04, draw: 2}
          - {os: ubuntu-22.04, draw: 3}
          - {os: ubuntu-22.04, draw: 4}
          - {os: ubuntu-22.04, draw: 5}
          - {os: ubuntu-22.04, draw: 6}
          - {os: ubuntu-24.04, draw: 1}
          - {os: ubuntu-24.04, draw: 2}
          - {os: ubuntu-24.04, draw: 3}
          - {os: ubuntu-24.04, draw: 4}
          - {os: ubuntu-24.04, draw: 5}
          - {os: ubuntu-24.04, draw: 6}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/nm2 && tools/cpu_gate.sh results/nm2/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_nm.py cases/nm && python3 -I tools/gen_nm2.py cases/nm
      - name: Record input hashes
        run: sha256sum cases/nm/nm.json cases/nm/nm2.json tools/gen_nm.py tools/gen_nm2.py drivers/ref_nm2.m drivers/nm_apsp_a.m drivers/nm_apsp_b.m drivers/nm_split_local.m | tee results/nm2/inputs_sha256.txt
      - name: Fetch and verify GraphVar 2.03a from NITRC (never committed)
        run: tools/fetch_graphvar.sh "$RUNNER_TEMP/gv"
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          sha256sum "$file" | tee -a results/nm2/cpu.txt
      - name: Null-model battery 2
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); ref_nm2(fullfile(getenv('RUNNER_TEMP'),'bct','2019_03_03_BCT'), fullfile(getenv('RUNNER_TEMP'),'gv','GraphVar_2.03a'), 'cases/nm', 'results/nm2')
      - name: Hash outputs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          rm -rf results/nm2/swp_local
          (cd results/nm2 && sha256sum nm2.jsonl) | tee results/nm2/outputs_sha256.txt
      - name: Upload
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nm2-${{ matrix.os }}-${{ matrix.draw }}
          path: results/nm2
  # Evidence only (no CPU gate): GraphVar's small_world_propensity with graphallshortestpaths, on releases
  # that may still have it. Shortest-path sums use no BLAS.
  old:
    strategy:
      fail-fast: false
      matrix:
        release: [R2021b, R2022a, R2022b, R2023a]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: CPU
        run: mkdir -p results/nm2 && (grep -m1 'model name' /proc/cpuinfo || true) | tee results/nm2/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_nm.py cases/nm && python3 -I tools/gen_nm2.py cases/nm
      - name: Fetch and verify GraphVar 2.03a from NITRC (never committed)
        run: tools/fetch_graphvar.sh "$RUNNER_TEMP/gv"
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: Statistics_and_Machine_Learning_Toolbox Bioinformatics_Toolbox
      - name: Null-model battery 2 (old release)
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); ref_nm2(fullfile(getenv('RUNNER_TEMP'),'bct','2019_03_03_BCT'), fullfile(getenv('RUNNER_TEMP'),'gv','GraphVar_2.03a'), 'cases/nm', 'results/nm2')
      - name: Hash outputs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          rm -rf results/nm2/swp_local
          (cd results/nm2 && sha256sum nm2.jsonl) | tee results/nm2/outputs_sha256.txt
      - name: Upload
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nm2-old-${{ matrix.release }}
          path: results/nm2
