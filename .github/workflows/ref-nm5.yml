name: "Null models 5 (Louvain and community detection: community_louvain traced, GraphVar copies and menu helpers)"
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  r2026b:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, draw: 1}
          - {os: ubuntu-22.04, draw: 2}
          - {os: ubuntu-22.04, draw: 3}
          - {os: ubuntu-22.04, draw: 4}
          - {os: ubuntu-22.04, draw: 5}
          - {os: ubuntu-22.04, draw: 6}
          - {os: ubuntu-24.04, draw: 1}
          - {os: ubuntu-24.04, draw: 2}
          - {os: ubuntu-24.04, draw: 3}
          - {os: ubuntu-24.04, draw: 4}
          - {os: ubuntu-24.04, draw: 5}
          - {os: ubuntu-24.04, draw: 6}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Approved CPU only
        run: mkdir -p results/nm5 && tools/cpu_gate.sh results/nm5/cpu.txt
      - name: Generate synthetic inputs
        run: python3 -I tools/gen_nm5.py cases/nm5
      - name: Record input hashes
        run: sha256sum cases/nm5/nm5.json tools/gen_nm5.py drivers/ref_nm5.m | tee results/nm5/inputs_sha256.txt
      - name: Fetch and verify GraphVar 2.03a from NITRC (never committed)
        run: tools/fetch_graphvar.sh "$RUNNER_TEMP/gv"
      - name: Fetch and verify BCT 2019-03-03 (never committed)
        run: tools/fetch_bct.sh "$RUNNER_TEMP/bct"
      - id: setup
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record MathWorks binary provenance
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          sha256sum "$file" | tee -a results/nm5/cpu.txt
      - name: Null-model battery 5
        timeout-minutes: 40
        uses: matlab-actions/run-command@v3
        with:
          command: maxNumCompThreads(1); addpath('drivers'); ref_nm5(fullfile(getenv('RUNNER_TEMP'),'bct','2019_03_03_BCT'), fullfile(getenv('RUNNER_TEMP'),'gv','GraphVar_2.03a'), 'cases/nm5', 'results/nm5')
      - name: Hash outputs
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          (cd results/nm5 && sha256sum nm5.jsonl) | tee results/nm5/outputs_sha256.txt
      - name: Upload
        if: ${{ always() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: nm5-${{ matrix.os }}-${{ matrix.draw }}
          path: results/nm5
